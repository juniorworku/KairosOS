<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kairos Focus</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-page="blocked">
    <h1>Focus session</h1>
    <h2 id="session">Current session</h2>
    <div id="timer" role="timer">00:00</div>
    <p>This site is on your focus blocklist.</p>
    <button class="primary" id="back">Back to focus</button
    ><button id="pause">Pause blocking for 5 minutes</button
    ><button id="end">End session</button>
    <p id="message" role="status"></p>
    <script type="module" src="/src/ui.ts"></script>
  </body>
</html>
