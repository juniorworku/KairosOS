name: Core application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      OWNER_EMAIL: ''
      TEST_DATABASE_URL: postgresql+asyncpg://kairos:kairos@localhost:5432/kairos
      DATABASE_URL: postgresql+asyncpg://kairos:kairos@localhost:5432/kairos
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.lock
      - run: python -m pip install -r api/requirements.lock
      - run: python -m pip install --no-deps -e ./api
      - run: ruff check app tests
        working-directory: api
      - run: ruff format --check app tests
        working-directory: api
      - run: mypy app
        working-directory: api
      - run: pytest
        working-directory: api

  web-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api/requirements.lock
      - run: python -m pip install --no-deps -e ./api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            extension/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: extension
      - run: python -m app.export_openapi
        working-directory: api
      - run: npm run generate:api
        working-directory: web
      - run: git diff --exit-code -- api/openapi.json web/src/api/schema.d.ts
      - run: npm run lint && npm run typecheck && npm run test && npm run build
        working-directory: web
      - run: npm run typecheck && npm run test && npm run build
        working-directory: extension

  local-stack-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: docker compose config --quiet
      - run: docker compose up --build -d
        env:
          KAIROS_WEB_COMMAND: npm ci && npm run build && npm exec vite preview -- --host 0.0.0.0 --port 5173
      - name: Wait for app dependencies
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --output /dev/null http://localhost:8000/readyz && \
               curl --fail --silent --output /dev/null http://localhost:5173 && \
               curl --fail --silent --output /dev/null http://localhost:8025/api/v1/info; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Reapply migrations and run database tests
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic upgrade head
          docker compose exec -T -e TEST_DATABASE_URL=postgresql+asyncpg://kairos:kairos@db:5432/kairos api python -m pytest
      - name: Check worker and service liveness
        run: |
          docker compose exec -T worker celery -A app.jobs.celery_app:celery_app inspect ping --timeout=10
          test "$(docker compose ps --status running --services | wc -l)" -eq 7
          curl --fail --silent http://localhost:8000/healthz
      - name: Run complete local browser workflow
        run: npm run e2e
        working-directory: web
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:5173
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop ephemeral local services
        if: always()
        run: docker compose down --volumes

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r api/requirements.lock
      - run: npm ci && npm audit --audit-level=low
        working-directory: web
      - run: npm ci && npm audit --audit-level=low
        working-directory: extension
