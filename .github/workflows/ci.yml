name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.lock
      - run: python -m pip install -r api/requirements.lock
      - run: python -m pip install --no-deps -e ./api
      - run: ruff check app tests
        working-directory: api
      - run: mypy app
        working-directory: api
      - run: ruff format --check app tests
        working-directory: api
      - run: pytest
        working-directory: api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r api/requirements.lock
      - run: python -m pip install --no-deps -e ./api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python -m app.export_openapi
        working-directory: api
      - run: npm run generate:api
        working-directory: web
      - run: git diff --exit-code -- api/openapi.json web/src/api/schema.d.ts
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for API and web
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/readyz && curl --fail --silent --output /dev/null http://localhost:5173; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply and reapply baseline migration
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic upgrade head
      - name: Check worker, beat and liveness
        run: |
          docker compose exec -T worker celery -A app.jobs.celery_app:celery_app inspect ping --timeout=10
          test "$(docker compose ps --status running --services | wc -l)" -eq 7
          curl --fail http://localhost:8000/healthz
          curl --fail http://localhost:5173/healthz
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop local services
        if: always()
        run: docker compose down --volumes

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r api/requirements.lock
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=low
        working-directory: web
