[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-api"
version = "0.1.0"
description = "Kairos goal-to-action planning API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.34.2",
  "pydantic-settings==2.9.1",
  "sqlalchemy[asyncio]==2.0.40",
  "asyncpg==0.30.0",
  "alembic==1.15.2",
  "redis==5.2.1",
  "celery[redis]==5.5.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.28.1", "ruff==0.11.8", "mypy==1.15.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
