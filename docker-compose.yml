name: kairos

x-api: &api
  build: ./api
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: dev
    OWNER_EMAIL: ${OWNER_EMAIL:-owner@localhost.test}
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
    EMAIL_PROVIDER: smtp
    APP_BASE_URL: http://localhost:5173
    DATABASE_URL: postgresql+asyncpg://kairos:kairos@db:5432/kairos
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./api:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kairos -d kairos]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *api
    command: sh -c "alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --no-access-log"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - 127.0.0.1:8000:8000

  worker:
    <<: *api
    command: celery -A app.jobs.celery_app:celery_app worker --loglevel=info --concurrency=2

  beat:
    <<: *api
    command: celery -A app.jobs.celery_app:celery_app beat --loglevel=info --schedule=/tmp/kairos-celerybeat

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "${KAIROS_WEB_COMMAND:-npm ci && npm run dev -- --host 0.0.0.0}"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_EXTENSION_ID: ${EXTENSION_ID:-}
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-dist:/app/dist
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:8025:8025

volumes:
  postgres-data:
  web-node-modules:
  web-dist:
