tters.<span class="muted">2 suggested changes</span></span><button class="softbtn" data-action="review-proposal">Review changes ${I('arrow')}</button></div>`:`<div class="proposal-strip" style="background:white"><span>${I('check')} Your accepted plan is in place.</span><button class="softbtn" data-action="start-focus" data-event="research">Start focus ${I('play')}</button></div>`}</section>${state.coach?coach():''}</div>`;
}
function goalRow(title,icon,progress,open,isMain=false){return `<div class="goal"><button class="goal-top" data-action="${isMain?'toggle-goal':'goal-detail'}" data-title="${esc(title)}"><span class="goal-symbol">${I(icon)}</span>${esc(title)}<span class="goal-chevron">${open?'⌄':'›'}</span></button><div class="goal-meta"><div class="progress"><span style="width:${progress}%"></span></div>${progress}%</div>${open?`<div class="tasklist"><div class="task ${(state.doneTasks||[]).includes('Research interview themes')?'done':''}" draggable="true" data-task="Research interview themes"><button class="check" data-action="task-check" aria-label="Complete research interview themes"></button><span>Research interview themes</span></div><div class="task ${(state.doneTasks||[]).includes('Refine the onboarding flow')?'done':''}" draggable="true" data-task="Refine the onboarding flow"><button class="check" data-action="task-check" aria-label="Complete refine the onboarding flow"></button><span>Refine the onboarding flow</span></div><div class="task ${(state.doneTasks||[]).includes('Send first beta invitations')?'done':''}" draggable="true" data-task="Send first beta invitations"><button class="check" data-action="task-check" aria-label="Complete send beta invitations"></button><span>Send first beta invitations</span></div><button class="purple" data-action="capture" style="font-size:10px;text-align:left;padding:2px 0">+ Add task</button></div>`:''}</div>`;}
function formatHour(h){let n=Math.floor(h);let m=Math.round((h-n)*60);return `${n%12||12}:${String(m).padStart(2,'0')}`;}
function eventMarkup(e){return `<button class="event ${e.type}" data-action="event-detail" data-id="${e.id}" draggable="${e.fixed?'false':'true'}" style="top:${(e.hour-8)*10}%;height:${e.duration*10}%" aria-label="${esc(e.title)}, ${formatHour(e.hour)}, ${e.fixed?'fixed time':''}"><strong>${esc(e.title)}</strong><small>${formatHour(e.hour)} – ${formatHour(e.hour+e.duration)}</small>${e.fixed?`<span class="event-tag">${I('lock')}Fixed time</span>`:e.type==='focus'?`<span class="event-tag">${I('goal')}Goal time</span>`:''}</button>`;}
function coach(){return `<aside class="coach" aria-label="AI coach"><div class="coach-header"><span>${I('spark')} Your coach</span><button class="icon" data-action="toggle-coach" aria-label="Close coach">${I('close')}</button></div><div><div class="brief-date">MONDAY, NOVEMBER 2 · SAMPLE BRIEF</div><h2 class="greeting">A clear start.<br>A meaningful day.</h2><p>You have <strong>3 hours of focus time</strong> planned. Let’s protect your morning and close the loop with Maya.</p></div><div><div class="coach-section-title">Your core priorities<span>Today</span></div><ol class="priorities"><li><span class="priority-num">1</span><div>Validate the beta offer<small>Customer research · 9:00 AM</small></div></li><li><span class="priority-num">2</span><div>Send Maya the proposal<small>Your promise · due today</small></div></li><li><span class="priority-num">3</span><div>Leave room to follow through<small>Inbox & commitments · 3:00 PM</small></div></li></ol></div><div class="coach-card"><div class="eyebrow">${I('spark')} A small adjustment</div><h3>${state.proposal?'Your client call needs a full hour of prep.':'Your plan is ready. Start with research.'}</h3><p>${state.proposal?'Move research earlier and use the freed afternoon slot for your promise to Maya. Nothing changes until you approve.':'The suggested changes are approved in this prototype. Your fixed blocks are preserved.'}</p><button class="softbtn" data-action="${state.proposal?'review-proposal':'start-focus'}" data-event="research">${state.proposal?'Review the plan':'Start focus'} ${I('arrow')}</button></div><div><div class="coach-section-title">Before your next meeting<span>11:00 AM</span></div><button class="mini-row" data-action="dossier" style="text-align:left;padding:0">${I('file')}<span>Acme · discovery call<small>History, open threads & your promises ${I('arrow')}</small></span></button></div><div id="chat-result"></div><form class="chatbox" id="coach-form"><textarea aria-label="Message your coach" placeholder="What needs your attention today?"></textarea><button type="submit" aria-label="Send to prototype coach">${I('arrow')}</button></form></aside>`;}
function commitments(){let rows=state.ledger.filter(l=>state.filter==='All commitments'||l.kind===state.filter||state.filter==='Suggested'&&l.status==='Suggested');return `<section class="standard"><div class="page-heading"><div><div class="eyebrow" style="margin-bottom:9px">Nothing left in your head</div><h1>Your commitments</h1><p>What you owe, what you’re waiting for, and the context to act.</p></div><button class="primary" data-action="capture">${I('plus')}Capture</button></div><div class="summary-cards"><div class="summary-card"><label>Needs your attention</label><b>${state.ledger.filter(l=>!l.done).length}</b><small>Across email, meetings & manual entry</small></div><div class="summary-card"><label>Waiting on others</label><b>${state.ledger.filter(l=>l.kind==='Waiting on them'&&!l.done).length}</b><small>Follow-up drafts, ready to review</small></div><div class="summary-card"><label>Closed this week</label><b>${8+state.completed}</b><small>Confirmed completions · sample history</small></div></div><div class="tabs">${['All commitments','My promises','Reply debt','Waiting on them','Suggested'].map(t=>`<button class="${state.filter===t?'active':''}" data-action="filter" data-filter="${t}">${t}</button>`).join('')}</div><div style="border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;overflow:hidden">${rows.length?rows.map(l=>`<div class="ledger-row" style="${l.done?'opacity:.5':''}"><span class="goal-symbol" style="width:26px">${I(l.source.startsWith('Gmail')?'mail':l.source.startsWith('Meeting')?'file':'check')}</span><div><h3 style="${l.done?'text-decoration:line-through':''}">${esc(l.title)}</h3><p>${esc(l.source)} · ${esc(l.person)}</p></div><span><span class="pill ${['VIP','Needs reply','Suggested'].includes(l.status)?'accent':''}">${l.done?'Resolved':l.status}</span></span><span>${esc(l.due)}</span><button class="outline" data-action="commitment-detail" data-id="${l.id}">${l.done?'View':l.action} ${I('chevron')}</button></div>`).join(''):'<div class="empty">No commitments in this view. A little breathing room.</div>'}</div><p class="muted" style="font-size:10px;line-height:1.7;margin-top:20px">Sample ledger · A reply is evidence, not automatic resolution. Nothing is sent from this prototype.</p></section>`;}
function goals(){return `<section class="standard"><div class="page-heading"><div><div class="eyebrow" style="margin-bottom:9px">Direction before motion</div><h1>Make room for what matters.</h1><p>Your season, your outcomes, and the next meaningful step.</p></div><button class="primary" data-action="new-goal">${I('plus')}New goal</button></div><div class="tabs"><button class="active">This season · Nov – Jan</button></div><div class="card-grid" style="margin-top:23px">${[['Launch paid beta','Ten paying customers by January 31.','goal',40,'4 of 10 paying customers','2h 30m planned this week'],['Grow consulting','Build a steady pipeline of meaningful client work.','chart',65,'3 of 5 warm leads contacted','3h planned this week'],['Health & energy','Build a sustainable routine that supports good work.','leaf',28,'2 of 3 weekly sessions','2h planned this week'],...state.newGoals.map(g=>[g.title,g.outcome,'goal',0,'Ready to begin',g.capacity+'h weekly capacity'])].map(([title,desc,icon,pct,metric,planned])=>`<article class="big-card"><span class="template-icon">${I(icon)}</span><h2>${esc(title)}</h2><p>${esc(desc)}</p><div class="progress"><span style="width:${pct}%"></span></div><small>${esc(metric)}</small><footer><small>${esc(planned)}</small><button class="softbtn" data-action="goal-detail" data-title="${esc(title)}">View plan ${I('arrow')}</button></footer></article>`).join('')}</div><div class="info" style="margin-top:24px">Progress shown here is sample outcome evidence. Focus time is tracked separately and never substitutes for goal completion.</div></section>`;}
function review(){return `<section class="standard"><div class="page-heading"><div><div class="eyebrow" style="margin-bottom:9px">Make the next week a little wiser</div><h1>Progress you can point to.</h1><p>October 26 – November 1 · Sample review</p></div><button class="primary" data-action="check-out">Daily check-out ${I('arrow')}</button></div><div class="summary-cards"><div class="summary-card"><label>Commitments closed</label><b>${8+state.completed}</b><small>Confirmed outcomes, not reminders sent</small></div><div class="summary-card"><label>Recorded focus</label><b>12h 40m</b><small>Of 16 hours planned · sample session log</small></div><div class="summary-card"><label>Goal check-ins</label><b>3</b><small>Across your active season goals</small></div></div><div class="review-layout"><div class="panel"><h2>What moved forward</h2><div class="review-item"><span class="goal-symbol">${I('check')}</span><div>Interviewed four potential beta customers<small>Offer clarity improved. Two interview slots remain.</small></div></div><div class="review-item"><span class="goal-symbol">${I('check')}</span><div>Sent three proposals with clear next steps<small>One accepted. Two are in your waiting ledger.</small></div></div><div class="review-item"><span class="goal-symbol">${I('clock')}</span><div>Onboarding work moved twice<small>Try a fixed morning block next week. Review before applying.</small></div></div><button class="softbtn check-out" data-action="review-proposal">Review next-week suggestions ${I('arrow')}</button></div><div class="panel"><h2>Planned time vs recorded focus</h2><div class="bar-chart">${[65,82,45,91,70].map((h,i)=>`<div style="height:${h}%" class="${i===3?'current':''}"><span>${[2.5,3,1.5,3.2,2.4][i]}h</span></div>`).join('')}</div><div class="chart-labels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div><p class="muted" style="font-size:10px;line-height:1.7;margin-top:25px">Logged focus sessions only. This chart does not infer how you spent untracked time.</p><div class="info">Friday wrap and week-ahead prep share the same review record, so you won’t receive competing summaries.</div></div></div></section>`;}
function assistant(){return `<section class="standard"><div class="page-heading"><div><div class="eyebrow" style="margin-bottom:9px">Set it once. Stay in control.</div><h1>Your assistant, on a rhythm.</h1><p>Pick a workflow. Tune it in a short chat. Review exactly what will run.</p></div><button class="outline" data-action="sources">${I('link')} Sources & usage</button></div><div class="card-grid">${templates.map(([name,icon,desc,cadence,status])=>`<article class="big-card template-card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="template-icon">${I(icon)}</span><span class="pill ${status==='Active'||state.loops.includes(name)?'accent':''}">${state.loops.includes(name)?'Active':status==='Active'?'Sample active':'Not activated'}</span></div><h2>${name}</h2><p class="description">${desc}</p><small>${cadence}</small><button class="${status==='Active'||state.loops.includes(name)?'outline':'softbtn'}" data-action="configure-loop" data-template="${name}">${status==='Active'||state.loops.includes(name)?'Review workflow':'Set up with coach'} ${I('arrow')}</button></article>`).join('')}</div><div class="info" style="margin-top:25px">Fixed templates, clear boundaries. Chat fills supported settings; it cannot create arbitrary automations or increase authority. Specialized workflow grouping remains a product decision.</div></section>`;}
function focusView(){return `<section class="focus-page"><div class="focus-main"><div class="route-label" style="justify-content:center">${I('goal')} FOCUS SESSION</div><h1>${esc(timer.task)}</h1><p>One meaningful step. Everything else can wait.</p><div class="focus-clock" id="focus-clock">${timeString()}</div><div class="focus-actions"><button class="primary" data-action="pause-timer">${I(timer.paused?'play':'pause')}<span id="pause-label">${timer.paused?'Resume':'Pause'}</span></button><button class="outline" data-action="finish-focus">${I('check')}Finish session</button></div><div class="focus-options"><button data-action="audio" aria-pressed="${audioOn}">${I('music')}<span id="audio-label">${audioOn?'Ambient tone playing':'Play ambient tone'}</span></button><button data-action="blocking-info">${I('shield')}Blocking preview</button><button data-action="nav" data-view="Today">${I('calendar')}Back to calendar</button></div><div class="focus-banner">Prototype mode · no websites or applications are blocked.</div></div></section>`;}
function timeString(){let sec=timer.paused?timer.remaining:timer.running?Math.max(0,timer.base-Math.floor((Date.now()-timer.startedAt)/1000)):25*60;return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function saveTimer(){try{localStorage.setItem('kairos-design-timer',JSON.stringify(timer));}catch{}}
function renderFloater(){ $('#floating')?.remove();if(!timer.running||state.view==='Focus')return;let el=document.createElement('aside');el.id='floating';el.className='floating-timer'+(timerMinimized?' minimized':'');el.setAttribute('aria-label','Floating focus timer');el.innerHTML=`<span class="timer-grip" tabindex="0" role="button" aria-label="Move timer with arrow keys">⠿</span><button class="timer-task" data-action="focus-view">${esc(timer.task)}</button><strong id="float-time">${timeString()}</strong><button class="icon" data-action="pause-timer" aria-label="${timer.paused?'Resume':'Pause'} focus timer">${I(timer.paused?'play':'pause')}</button><button class="icon" data-action="finish-focus" aria-label="Finish focus session">${I('check')}</button><button class="icon minimize-toggle" data-action="minimize-timer" aria-label="${timerMinimized?'Expand':'Minimize'} timer">${timerMinimized?'+':'−'}</button>`;document.body.append(el);let grip=el.querySelector('.timer-grip'),start;
 grip.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop};grip.setPointerCapture(e.pointerId);});grip.addEventListener('pointermove',e=>{if(!start)return;el.style.left=Math.max(5,Math.min(innerWidth-el.offsetWidth-5,start.l+e.clientX-start.x))+'px';el.style.top=Math.max(5,Math.min(innerHeight-el.offsetHeight-65,start.t+e.clientY-start.y))+'px';el.style.right='auto';el.style.bottom='auto';});grip.addEventListener('pointerup',()=>start=null);grip.addEventListener('keydown',e=>{if(!e.key.startsWith('Arrow'))return;e.preventDefault();let dx=e.key==='ArrowRight'?15:e.key==='ArrowLeft'?-15:0,dy=e.key==='ArrowDown'?15:e.key==='ArrowUp'?-15:0;el.style.left=Math.max(5,Math.min(innerWidth-el.offsetWidth-5,el.offsetLeft+dx))+'px';el.style.top=Math.max(5,Math.min(innerHeight-el.offsetHeight-65,el.offsetTop+dy))+'px';el.style.right='auto';el.style.bottom='auto';});}
function openModal(title,sub,body,footer='',wide=false){closeModal();modalLastFocus=document.activeElement;let el=document.createElement('div');el.className='overlay';el.id='modal';el.innerHTML=`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${sub}</p></div><button class="icon" data-action="close-modal" aria-label="Close dialog">${I('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-foot">${footer}</div>`:''}</section>`;document.body.append(el);el.querySelector('input,textarea,select,button')?.focus();el.addEventListener('click',e=>{if(e.target===el)closeModal();});}
function closeModal(){const m=$('#modal');if(m){m.remove();if(modalLastFocus?.isConnected)modalLastFocus.focus();}}
function eventDetail(id){let e=state.events.find(x=>x.id===id);if(!e)return;openModal(esc(e.title),`${e.type==='external'?'Google Calendar · sample event':e.type==='focus'?'Goal-linked time block':'Personal time block'}`,`<div class="details-list"><div class="detail-row">${I('clock')}<div>${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][e.day]}, November ${2+e.day}<small>${formatHour(e.hour)} – ${formatHour(e.hour+e.duration)} · ${Math.round(e.duration*60)} minutes</small></div></div><div class="detail-row">${I('goal')}<div>${esc(e.goal)}<small>Linked goal or support area</small></div></div><div class="detail-row">${I('file')}<div>${esc(e.notes)}</div></div></div><label class="checkbox-label"><input type="checkbox" id="fixed-check" data-id="${id}" ${e.fixed?'checked':''}>${I('lock')}Keep this time fixed</label><div class="info">Fixed blocks stay in place during routine planning. You can still explicitly edit them.</div>`,`<button class="outline" data-action="schedule-edit" data-id="${id}">Edit time</button>${e.type==='external'?`<button class="primary" data-action="dossier">Meeting prep ${I('arrow')}</button>`:`<button class="primary" data-action="start-focus" data-event="${id}">${I('play')}Start focus</button>`}`);}
function proposals(){if(!state.proposal){toast('Your sample changes are already approved.');return;}openModal('A little room to follow through.','Two suggestions. Your accepted plan stays in place until you approve.',`<div class="proposal-item"><h3><input type="checkbox" id="proposal-move" checked style="accent-color:var(--accent)"><span class="pill accent">MOVE</span> Customer research</h3><div class="before-after"><div><label>ACCEPTED</label>Monday · 9:00 – 10:30</div>${I('arrow')}<div class="after"><label>PROPOSED</label>Monday · 8:30 – 10:00</div></div><p>Creates a quiet preparation window before the Acme call. Your fixed blocks are unchanged.</p></div><div class="proposal-item"><h3><input type="checkbox" id="proposal-add" checked style="accent-color:var(--accent)"><span class="pill accent">ADD</span> Follow up with Maya</h3><div class="before-after"><div><label>PROPOSED</label>Monday · 3:45 – 4:30 PM</div><div class="after">45 minutes · commitment time</div></div><p>Closes a promise due today. Independent of the research move; you can approve either change.</p></div><div class="info">Destination: sample Kairos calendar only. Approval changes this prototype, not Google Calendar. Equivalent dismissed suggestions stay dismissed in this session.</div>`,`<button class="outline" data-action="dismiss-proposal">Dismiss suggestions</button><button class="primary" data-action="apply-proposal">${I('check')}Approve selected changes</button>`,true);}
function ledgerDetail(id){const l=state.ledger.find(l=>l.id===Number(id));if(!l)return;let draft=l.kind==='Waiting on them'?`Hi Jordan, just checking in on the landing page feedback. Any thoughts when you have a moment? Thanks!`:`Hi ${l.person.split(' ')[0]}, thanks for your patience. I’ve reviewed the details and will share the updated proposal with the scope and next steps today. Best, Alex`;
 openModal(esc(l.title),`${esc(l.source)} · ${esc(l.person)}`,`<span class="pill accent">${l.done?'Resolved':l.status}</span><h3 style="font-size:12px;margin-top:22px">Source evidence</h3><div class="chat-example">${esc(l.text)}</div><p class="muted" style="font-size:11px;line-height:1.7">${esc(l.note)}</p>${l.status==='Suggested'?'<div class="info">This is a candidate from supplied meeting notes. Accepting adds it to your commitment ledger.</div>':`<div class="field" style="margin-top:22px"><label for="draft-text">Prepared draft · edit before approving</label><textarea id="draft-text" style="min-height:130px">${esc(draft)}</textarea></div><div class="info">Sending a reply does not automatically resolve the underlying promise. This prototype never sends email.</div>`}`,`${!l.done?`<button class="outline" data-action="resolve-commitment" data-id="${l.id}">Mark resolved</button>`:''}${l.status==='Suggested'?`<button class="primary" data-action="accept-commitment" data-id="${l.id}">Accept commitment</button>`:!l.done?`<button class="primary" data-action="draft-approve" data-id="${l.id}">Review sending ${I('arrow')}</button>`:'<button class="primary" data-action="close-modal">Done</button>'}`);}
function goalWizard(step=0,restore=false){if(step===0){if(!restore)goalDraft=state.savedGoalDraft||{title:'Launch my paid beta',outcome:'Ten paying customers',capacity:'5',horizon:'6 weeks'};openModal('Start with what matters.','A short conversation turns an ambition into a realistic plan.',`<div class="steps-indicator"><span class="on"></span><span></span><span></span></div><div class="field"><label for="goal-title">What do you want to achieve?</label><input id="goal-title" value="${esc(goalDraft.title)}"></div><div class="field"><label>Planning horizon</label><div class="horizons">${['1 day','1 week','2 weeks','4 weeks','6 weeks','12 weeks'].map(h=>`<button class="${h===goalDraft.horizon?'active':''}" data-action="horizon" data-horizon="${h}">${h}</button>`).join('')}</div></div><div class="info">Your coach will clarify success, available time and follow-up. You’ll review the plan before anything is scheduled.</div>`,`<button class="outline" data-action="save-goal-draft">Save for later</button><button class="primary" data-action="goal-step-1">Clarify the goal ${I('arrow')}</button>`);}else if(step===1){openModal('What would success look like?','Let’s give your plan an outcome and room to breathe.',`<div class="steps-indicator"><span class="on"></span><span class="on"></span><span></span></div><div class="chat-example">“${esc(goalDraft.title)}”<br><span class="muted">What measurable result would make this a success?</span></div><div class="field"><label for="goal-outcome">Success measure</label><input id="goal-outcome" value="${esc(goalDraft.outcome)}"></div><div class="field-row"><div class="field"><label for="goal-capacity">Hours available each week</label><input type="number" min="1" max="40" id="goal-capacity" value="${goalDraft.capacity}"></div><div class="field"><label for="goal-obstacle">Main obstacle</label><select id="goal-obstacle"><option>Too many competing priorities</option><option>Unclear next step</option><option>Waiting on someone else</option></select></div></div><div class="info">The prototype uses a prepared plan to demonstrate the flow; no AI service is called.</div>`,`<button class="outline" data-action="goal-back-start">Back</button><button class="primary" data-action="goal-step-2">See the proposed plan ${I('arrow')}</button>`);}else{let hrs=Number(goalDraft.capacity)||5;openModal('A plan you can make your own.','Review the tasks and follow-up. Nothing is activated yet.',`<div class="steps-indicator"><span class="on"></span><span class="on"></span><span class="on"></span></div><div class="onboarding-preview"><h3>${esc(goalDraft.title)}</h3><div class="muted">${esc(goalDraft.outcome)} · ${esc(goalDraft.horizon)} · ${hrs}h / week</div><ul><li>Clarify the offer and identify five people to learn from.</li><li>Validate the smallest useful version with customers.</li><li>Invite the first paying users and review what works.</li></ul></div><div class="proposal-item" style="margin-top:15px"><h3>${I('calendar')} Proposed time allocation</h3><p>${Math.round(hrs*60*.6)} minutes of focused delivery and ${Math.round(hrs*60*.4)} minutes of outreach per week. No calendar writes are included in this approval.</p></div><div class="proposal-item"><h3>${I('refresh')} Goal check-in</h3><p>Every Wednesday at 4:00 PM. Review recorded progress and flag slipping work. May prepare reports and proposals; cannot send or move events.</p></div>`,`<button class="outline" data-action="goal-back">Edit answers</button><button class="primary" data-action="activate-goal">${I('check')}Approve plan & check-in</button>`);}}
function loopWizard(name,preview=false){wizardTemplate=name;if(!preview){openModal(`Set up ${esc(name.toLowerCase())}.`,'One short chat, with clear boundaries.',`<div class="chat-example"><span class="purple">Kairos</span><br>When should I run this workflow, and what should I pay attention to?</div><div class="field"><label for="loop-request">Your preferences</label><textarea id="loop-request" placeholder="Every weekday at 7:30. Keep it short and highlight commitments due today.">Every weekday at 7:30. Keep it short and highlight commitments due today.</textarea></div><div class="field-row"><div class="field"><label for="loop-time">Run time</label><input type="time" value="07:30" id="loop-time"></div><div class="field"><label for="loop-cadence">Cadence</label><select id="loop-cadence"><option>Every weekday</option><option>Every day</option><option>Weekly</option></select></div></div><div class="info">Chat fills supported template settings. Writing style cannot change checks, permissions or authority.</div>`,`<button class="outline" data-action="close-modal">Cancel</button><button class="primary" data-action="loop-preview">Review workflow ${I('arrow')}</button>`);}else{let time=$('#loop-time').value,cadence=$('#loop-cadence').value;openModal('Here’s what will run.','A fixed template, configured for you.',`<div class="template-preview"><div><label>Template</label><strong>${esc(name)}</strong></div><div><label>When</label><span>${cadence} · ${time}</span></div><div><label>Sources</label><span>Sample calendar, ledger & goals</span></div><div><label>Output</label><span>In-app brief and proposals</span></div><div><label>Authority ceiling</label><span>Prepare only · approval to act</span></div><div><label>Stop condition</label><span>Until paused or stopped</span></div><div><label>Quiet hours</label><span>8:00 PM – 7:00 AM</span></div></div><div class="info">Activating changes this prototype’s workflow card. No server routine or notification subscription is created.</div>`,`<button class="outline" data-action="loop-back">Edit settings</button><button class="primary" data-action="activate-loop">${I('check')}Confirm workflow</button>`);}}
function startFocus(id){let e=state.events.find(e=>e.id===id)||state.events[1];timer={running:true,paused:false,remaining:25*60,base:25*60,startedAt:Date.now(),task:e.title,event:e.id};closeModal();state.view='Focus';saveTimer();render();}
function pauseTimer(){if(!timer.running)return;if(timer.paused){timer.base=timer.remaining;timer.startedAt=Date.now();timer.paused=false;}else{timer.remaining=Math.max(0,timer.base-Math.floor((Date.now()-timer.startedAt)/1000));timer.paused=true;}saveTimer();render();}
function finishFocus(){if(!timer.running)return;let elapsed=25*60-(timer.paused?timer.remaining:Math.max(0,timer.base-Math.floor((Date.now()-timer.startedAt)/1000)));if(!timer.paused)pauseTimer();openModal('A session worth closing well.','Time spent is effort. You decide what was accomplished.',`<div class="success-ring">${I('check')}</div><h3 style="font-size:16px;font-weight:500">${esc(timer.task)}</h3><p class="muted" style="font-size:12px">${Math.floor(elapsed/60)}m ${elapsed%60}s of recorded active time in this demo.</p><div class="field" style="margin-top:20px"><label for="session-result">What moved forward?</label><textarea id="session-result" placeholder="Capture the result, remaining work, or a blocker."></textarea></div><label class="checkbox-label"><input type="checkbox" id="session-done">This task is complete</label><div class="info">Unfinished work stays open. A new calendar block would need a separate proposal.</div>`,`<button class="outline" data-action="close-modal">Keep session paused</button><button class="primary" data-action="save-session">Save & return to my day</button>`);}
function toggleAudio(){try{if(audioOn){audioNodes.forEach(n=>{try{n.stop();}catch{}});audioNodes=[];audioCtx?.close();audioCtx=null;audioOn=false;}else{audioCtx=new(window.AudioContext||window.webkitAudioContext)();let gain=audioCtx.createGain();gain.gain.value=.025;gain.connect(audioCtx.destination);[130.81,164.81,196,261.63].forEach((freq,i)=>{let o=audioCtx.createOscillator();o.type='sine';o.frequency.value=freq;o.detune.value=i*2;o.connect(gain);o.start();audioNodes.push(o);});audioOn=true;}render();toast(audioOn?'Quiet synthesized ambient tone playing. No audio is recorded.':'Ambient tone stopped.');}catch{toast('Audio is unavailable in this browser. The timer still works.');}}

function scheduleEdit(id){let e=state.events.find(x=>x.id===id);if(!e)return;openModal('Make time for the work.','Edit the sample reservation. External effects remain simulated.',`<div class="field"><label for="edit-event-title">Title</label><input id="edit-event-title" value="${esc(e.title)}"></div><div class="field-row"><div class="field"><label for="edit-event-day">Day</label><select id="edit-event-day">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((d,i)=>`<option value="${i}" ${e.day===i?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label for="edit-event-time">Start time</label><input type="time" id="edit-event-time" value="${String(Math.floor(e.hour)).padStart(2,'0')}:${String(Math.round((e.hour%1)*60)).padStart(2,'0')}"></div></div><div class="field"><label for="edit-event-duration">Duration (minutes)</label><input type="number" id="edit-event-duration" min="15" max="240" step="15" value="${Math.round(e.duration*60)}"></div><div class="info">This is a direct edit you requested. Save updates only the prototype, with no Google Calendar write.</div>`,`<button class="outline" data-action="close-modal">Cancel</button><button class="primary" data-action="save-event" data-id="${id}">Save sample event</button>`);}
function dropProposal(id,day,hour,title){let old=state.events.find(e=>e.id===id);if(old?.fixed){toast('This block is fixed. Open its details to unlock it first.');return;}if(old&&old.type==='external'){toast('Review the direct edit before changing this sample Google event.');}window.pendingDrop={id,day,hour,title};openModal(old?'Review this move.':'Schedule your next step.','A concrete change, before it is applied.',`<div class="proposal-item"><h3>${I('calendar')}${esc(old?.title||title)}</h3><div class="before-after"><div><label>${old?'CURRENT':'TASK'}</label>${old?`${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][old.day]} · ${formatHour(old.hour)}`:'Not scheduled'}</div>${I('arrow')}<div class="after"><label>PROPOSED</label>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][day]} · ${formatHour(hour)}</div></div><p>${old?'The existing reservation stays in place until you approve.':'Creates one 45-minute sample block linked to your task.'}</p></div><div class="info">Destination: sample calendar only. This prototype warns about conflicting sample reservations before applying.</div>`,`<button class="outline" data-action="close-modal">Cancel</button><button class="primary" data-action="apply-drop">Approve ${old?'move':'block'}</button>`);}

 if(a==='area'){openModal(esc(b.dataset.area),'An ongoing responsibility, without needing a long-term goal.',`<div class="info">Keep tasks and commitments organized here. Select a task to schedule it, or capture something new.</div><div class="review-item">${I('list')}Review open responsibilities and choose the next action.</div>`,`<button class="primary" data-action="capture">${I('plus')}Capture a task</button>`);return;}
 if(a==='sources'){openModal('Sources & usage','A connected assistant, with visible boundaries.',`<div class="details-list"><div class="detail-row">${I('calendar')}<div>Google Calendar<small>Sample source · no live account connected</small></div></div><div class="detail-row">${I('mail')}<div>Gmail<small>Sample source · bounded 10-day history concept</small></div></div><div class="detail-row">${I('file')}<div>Meeting notes<small>Sample supplied transcript · native capture is later</small></div></div></div><div class="template-preview"><div><label>Scheduled loops</label><span>28% · sample usage</span></div><div><label>Extraction</label><span>16% · sample usage</span></div><div><label>Drafting & chat</label><span>12% · sample usage</span></div></div><div class="info">Daily brief capacity is reserved. Low budgets degrade to current deterministic facts rather than silently stopping. No credentials are requested in this prototype.</div>`,`<button class="primary" data-action="close-modal">Done</button>`);return;}
 if(a==='dossier'){openModal('Ready for Acme.','Meeting dossier · Monday, November 2 · 11:00 AM',`<div class="details-list"><div class="detail-row">${I('users')}<div>Maya Chen · Acme<small>Sample external client · discovery call</small></div></div><div class="detail-row">${I('goal')}<div>Desired outcome<small>Agree on the smallest useful beta scope and next decision.</small></div></div><div class="detail-row">${I('mail')}<div>Your open promise<small>Send the revised proposal with timeline today.</small></div></div><div class="detail-row">${I('file')}<div>Previous conversation<small>Maya asked for a clearer onboarding timeline and success measure.</small></div></div></div><div class="info">Prepared from fictional source-linked context. Older history outside the sample import window is not included.</div>`,`<button class="outline" data-action="commitment-detail" data-id="1">View commitment</button><button class="primary" data-action="meeting-notes">Add meeting notes ${I('arrow')}</button>`);return;}
 if(a==='meeting-notes'){openModal('What did you agree?','Supplied notes become sourced suggestions, not assumed commitments.',`<div class="field"><label for="meeting-note">Meeting notes or transcript</label><textarea id="meeting-note" style="min-height:160px">Maya agreed to review the beta scope on Wednesday. Alex will send the revised proposal and onboarding timeline today.</textarea></div><div class="info">This prototype demonstrates a prepared extraction, without calling an AI model.</div>`,`<button class="primary" data-action="extract-note">Review follow-through ${I('arrow')}</button>`);return;}
 if(a==='extract-note'){openModal('Two things to follow through.','Prepared candidates from the sample meeting note.',`<div class="proposal-item"><h3>${I('list')}Your promise</h3><p>Send revised proposal and onboarding timeline · today · Alex</p><p>Matches an existing commitment. Link the evidence instead of creating a duplicate.</p></div><div class="proposal-item"><h3>${I('clock')}Waiting on Maya</h3><p>Review beta scope · Wednesday · Maya Chen</p></div><div class="info">Review owners and dates before accepting. This action updates the sample ledger only.</div>`,`<button class="outline" data-action="close-modal">Dismiss</button><button class="primary" data-action="accept-notes">Accept & link evidence</button>`);return;}
 if(a==='accept-notes'){if(!state.ledger.some(l=>l.title==='Get Maya’s beta scope review'))state.ledger.push({id:Date.now(),title:'Get Maya’s beta scope review',person:'Maya Chen',source:'Meeting · Acme discovery',due:'Wednesday',kind:'Waiting on them',status:'Waiting',text:'“Maya agreed to review the beta scope on Wednesday.”',note:'Accepted from supplied sample meeting notes.',action:'View context'});persist();closeModal();state.view='Commitments';render();toast('Evidence linked and waiting item accepted in the sample ledger.');return;}
 if(a==='check-out'){openModal('Close the day with a clear head.','A short check-out, without automatic rollover.',`<div class="field"><label for="checkout-result">What moved forward?</label><textarea id="checkout-result" placeholder="Capture one meaningful result."></textarea></div><div class="field"><label for="checkout-next">What needs attention tomorrow?</label><textarea id="checkout-next" placeholder="Unfinished work, a blocker, or a new priority."></textarea></div><div class="info">Saving a reflection does not approve calendar changes. Unfinished commitments stay open until deliberately resolved, cancelled or deferred.</div>`,`<button class="primary" data-action="save-checkout">Save reflection</button>`);return;}
 if(a==='save-checkout'){state.reflection={result:$('#checkout-result').value,next:$('#checkout-next').value};persist();closeModal();toast('Sample reflection saved. Your commitments and schedule remain unchanged.');return;}
 if(a==='notifications'){openModal('Your assistant has been following up.','Sample feed · all information is fictional.',`<div class="notification-row">${I('sun')}<div>Your morning brief is ready<small>7:30 AM · Scheduled · generated before opening</small></div></div><div class="notification-row">${I('mail')}<div>Maya is waiting on your revised proposal<small>9:00 AM · Nudge · reply draft ready</small></div></div><div class="notification-row">${I('shield')}<div>A calendar adjustment is ready to review<small>9:15 AM · Quiet · nothing has moved</small></div></div><div class="info">Push and email fallback are not enabled here. Quiet hours and daily limits apply to the planned product.</div>`,`<button class="primary" data-action="close-modal">Done</button>`);return;}
 if(a==='help'){help();return;}
 if(a==='reset-demo'){try{localStorage.removeItem('kairos-design-v1');localStorage.removeItem('kairos-design-timer');}catch{}timer.running=false;saveTimer();if(audioOn)toggleAudio();state={view:'Today',coach:innerWidth>1000,goalOpen:true,filter:'All commitments',events:structuredClone(defaultEvents),ledger:structuredClone(ledgerSeed),proposal:true,newGoals:[],loops:[],dayOffset:0,dayMode:innerWidth<720,completed:0};closeModal();render();toast('Sample data reset.');return;}
});
document.addEventListener('change',e=>{if(e.target.id==='fixed-check'){let ev=state.events.find(v=>v.id===e.target.dataset.id);ev.fixed=e.target.checked;persist();render();toast(ev.fixed?'This sample block is now fixed.':'This sample block is now flexible.');}});
document.addEventListener('submit',e=>{if(e.target.id!=='coach-form')return;e.preventDefault();const input=e.target.querySelector('textarea'),text=input.value.trim();if(!text)return;if(/\/done/i.test(text)){document.querySelector('[data-action="check-out"]')?.click();if(!$('#modal')){state.view='Review';render();document.querySelector('[data-action="check-out"]').click();}return;}let content=/send|email|reply/i.test(text)?'I can prepare a reply for review. Open Maya’s commitment to inspect the source and approve the exact draft. No message will be sent from this prototype.':/hour|time|priorit|busy|focus|plan/i.test(text)?'Let’s preserve your accepted and fixed blocks. I’ve prepared two sample adjustments you can inspect in “Review the plan.” Nothing moves without your approval.':'In this prototype, try reviewing your day, adding a goal, inspecting commitments, or setting up a workflow. Responses are prepared examples; no AI service is connected.';$('#chat-result').innerHTML=`<div class="chat-feedback">${I('spark')} ${esc(content)}</div>`;input.value='';});
document.addEventListener('keydown',e=>{let modal=$('#modal');if(e.key==='Escape'&&modal){closeModal();return;}if(modal&&e.key==='Tab'){let els=[...modal.querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(el=>!el.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}if(e.target.classList?.contains('day-col')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();window.pendingDrop={id:null,day:Number(e.target.dataset.day),hour:10,title:'New focus task'};dropProposal(null,Number(e.target.dataset.day),10,'New focus task');}});
let dragging=null;
document.addEventListener('dragstart',e=>{const event=e.target.closest('.event'),task=e.target.closest('.task');if(event){dragging={id:event.dataset.id};e.dataTransfer.setData('text/plain',event.dataset.id||'');}else if(task){dragging={title:task.dataset.task};e.dataTransfer.setData('text/plain',task.dataset.task);}else return;e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{let col=e.target.closest('.day-col');if(!col)return;e.preventDefault();col.classList.add('dragover');});
document.addEventListener('dragleave',e=>{let col=e.target.closest('.day-col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('dragover');});
document.addEventListener('drop',e=>{let col=e.target.closest('.day-col');if(!col||!dragging)return;e.preventDefault();document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));let rect=col.getBoundingClientRect(),hour=8+Math.round(((e.clientY-rect.top)/rect.height*10)*4)/4;hour=Math.max(8,Math.min(17.25,hour));dropProposal(dragging.id,Number(col.dataset.day),hour,dragging.title);dragging=null;});
document.addEventListener('dblclick',e=>{if(e.target.classList.contains('day-col')){let rect=e.target.getBoundingClientRect(),hour=8+Math.round(((e.clientY-rect.top)/rect.height*10)*4)/4;dropProposal(null,Number(e.target.dataset.day),Math.max(8,Math.min(17.25,hour)),'New focus task');}});
setInterval(()=>{if(!timer.running)return;const time=timeString();if($('#focus-clock'))$('#focus-clock').textContent=time;if($('#float-time'))$('#float-time').textContent=time;if(time==='00:00'&&!timer.paused){timer.remaining=0;timer.paused=true;saveTimer();render();toast('Focus time is complete. Finish the session to record the outcome.');}},1000);
window.addEventListener('pagehide',()=>{if(audioOn){audioNodes.forEach(n=>{try{n.stop();}catch{}});}});
if(innerWidth<1000)state.coach=false;if(innerWidth<720)state.dayMode=true;
render();
</script></body></html>
